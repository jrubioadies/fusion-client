[project]
name = "fusion-client"
version = "0.1.0"
description = "Cliente compartido de Oracle Fusion: BI Publisher (lectura) y ESS (escritura)"
requires-python = ">=3.9"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fbip = "fusion_client.bip:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fusion_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: toca Fusion de verdad; desactivado por defecto"]
addopts = "-m 'not live'"
